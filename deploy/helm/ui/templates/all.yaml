apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: { app: agent-ui }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-ui-config
  labels: { app: agent-ui }
data:
  VITE_API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ui
  labels: { app: agent-ui }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: agent-ui }
  template:
    metadata:
      labels: { app: agent-ui }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: {{ .Values.probes.livenessPath }}, port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readinessPath }}, port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ui
  labels: { app: agent-ui }
spec:
  selector: { app: agent-ui }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-ui
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-ui }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
---
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-ui
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels: { app: agent-ui }
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-ui
spec:
  podSelector:
    matchLabels: { app: agent-ui }
  policyTypes: [Ingress, Egress]
  ingress:
    # Restricted: browser traffic enters via the ingress controller only (never open).
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.networkPolicy.ingressNamespace | default "ingress-nginx" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        {{- range .Values.networkPolicy.ingressFrom }}
        - podSelector:
            matchLabels: { app: {{ .from }} }
        {{- end }}
      ports:
        - port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector: { matchLabels: { name: kube-system } }
      ports:
        - port: 53
          protocol: UDP
    {{- range .Values.networkPolicy.egressTo }}
    - to:
        - podSelector:
            matchLabels: { app: {{ .to }} }
      ports:
        - port: {{ .port }}
    {{- end }}
{{- end }}
