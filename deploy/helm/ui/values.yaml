replicaCount: 2
image:
  repository: agent-workbench/ui
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 80
config:
  apiBaseUrl: http://agent-api:8080
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
probes:
  livenessPath: /
  readinessPath: /
  initialDelaySeconds: 5
  periodSeconds: 20
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
pdb:
  enabled: true
  minAvailable: 1
serviceAccount:
  create: true
  name: agent-ui
  annotations: {}
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  ingressFrom: []
  egressTo:
    - to: agent-api
      port: 8080
