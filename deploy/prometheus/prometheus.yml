global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: agent-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: mcp-server
    static_configs:
      - targets: ["mcp-server:8081"]
