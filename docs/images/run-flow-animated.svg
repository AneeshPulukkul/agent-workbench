<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Animated run flow: Classify, MCP reads, A2A delegate, Policy, Approval, Execute, Verify">
<title>Run flow (animated)</title>
<desc>SMIL opacity cycle over 7 stages, 7s loop. No JavaScript. Pause via OS reduced-motion: static fallback shows all stages.</desc>
<rect width="1200" height="340" rx="14" fill="#f6f7f9"/>
<text x="32" y="40" font-size="16" font-weight="700" fill="#0f172a">Run flow — Classify &#8594; MCP reads &#8594; A2A delegate &#8594; Policy &#8594; Approval &#8594; Execute &#8594; Verify</text>
<text x="32" y="60" font-size="11" fill="#64748b">SMIL opacity cycle, 7s loop &#183; amber = human gate &#183; static when prefers-reduced-motion</text>
<line x1="40" y1="170" x2="1160" y2="170" stroke="#cbd5e1" stroke-width="2"/>
<g opacity="0.45"><rect x="30" y="120" width="140" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="100" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1 Classify</text><text x="100" y="180" text-anchor="middle" font-size="11" fill="#64748b">objective+ctx</text><text x="100" y="196" text-anchor="middle" font-size="10" fill="#64748b">budgets</text><animate attributeName="opacity" values="1;0.45;0.45;0.45;0.45;0.45;0.45;1" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<g opacity="0.45"><rect x="190" y="120" width="140" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="260" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2 MCP reads</text><text x="260" y="180" text-anchor="middle" font-size="11" fill="#64748b">metrics/logs</text><text x="260" y="196" text-anchor="middle" font-size="10" fill="#64748b">15–30s</text><animate attributeName="opacity" values="0.45;1;0.45;0.45;0.45;0.45;0.45;0.45" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<g opacity="0.45"><rect x="350" y="120" width="140" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="420" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3 A2A delegate</text><text x="420" y="180" text-anchor="middle" font-size="11" fill="#64748b">observability</text><text x="420" y="196" text-anchor="middle" font-size="10" fill="#64748b">agent :8082</text><animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45;0.45;0.45;0.45" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<g opacity="0.45"><rect x="510" y="120" width="140" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="580" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">4 Policy</text><text x="580" y="180" text-anchor="middle" font-size="11" fill="#64748b">schema+budget</text><text x="580" y="196" text-anchor="middle" font-size="10" fill="#64748b">propose only</text><animate attributeName="opacity" values="0.45;0.45;0.45;1;0.45;0.45;0.45;0.45" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<g opacity="0.45"><rect x="670" y="120" width="140" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="740" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">5 Approval</text><text x="740" y="180" text-anchor="middle" font-size="11" fill="#b45309">human gate</text><text x="740" y="196" text-anchor="middle" font-size="10" fill="#64748b">approve/reject</text><animate attributeName="opacity" values="0.45;0.45;0.45;0.45;1;0.45;0.45;0.45" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<g opacity="0.45"><rect x="830" y="120" width="140" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="900" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">6 Execute</text><text x="900" y="180" text-anchor="middle" font-size="11" fill="#64748b">write tool 60s</text><text x="900" y="196" text-anchor="middle" font-size="10" fill="#64748b">checks row</text><animate attributeName="opacity" values="0.45;0.45;0.45;0.45;0.45;1;0.45;0.45" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<g opacity="0.45"><rect x="990" y="120" width="140" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="1060" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">7 Verify</text><text x="1060" y="180" text-anchor="middle" font-size="11" fill="#15803d">events close</text><text x="1060" y="196" text-anchor="middle" font-size="10" fill="#64748b">run.completed</text><animate attributeName="opacity" values="0.45;0.45;0.45;0.45;0.45;0.45;1;0.45" keyTimes="0;0.14;0.28;0.43;0.57;0.71;0.86;1" dur="7s" repeatCount="indefinite"/></g>
<text x="178" y="112" text-anchor="middle" font-size="14" fill="#94a3b8">&#8594;</text>
<text x="338" y="112" text-anchor="middle" font-size="14" fill="#94a3b8">&#8594;</text>
<text x="498" y="112" text-anchor="middle" font-size="14" fill="#94a3b8">&#8594;</text>
<text x="658" y="112" text-anchor="middle" font-size="14" fill="#94a3b8">&#8594;</text>
<text x="818" y="112" text-anchor="middle" font-size="14" fill="#b45309">&#8594;</text>
<text x="978" y="112" text-anchor="middle" font-size="14" fill="#94a3b8">&#8594;</text>
<circle cx="0" cy="0" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"><animateMotion dur="7s" repeatCount="indefinite" path="M40,170 L1160,170"/></circle>
<text x="32" y="260" font-size="11" fill="#64748b">Write tools never execute without a persisted human Approval row (server-enforced). Cancel: POST /v1/runs/{id}/cancel &#8594; 202 {status:"cancelled"}.</text>
<text x="32" y="280" font-size="11" fill="#64748b">Budgets: max_tool_calls 20 (1–100) &#183; max_model_calls 10 (1–50) &#183; max_cost_usd 2.0 &#183; Idempotency-Key on POST runs/decide.</text>
<text x="32" y="312" font-size="11" fill="#64748b">docs/images/run-flow-animated.svg &#183; SMIL only (no JS) &#183; 7 stages &#215; ~1s each</text>
</svg>